<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>מלחמה בקלפים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* 31.10 (אבירם): מלחמה בקלפים ועוד 1 עד ועוד 5. הרובוט למעלה, הילד למטה, קלף "ועוד N" באמצע השולחן. הילד אומר את התשובה בקול */
:root {
  --night: #101a3d; --table: #1c2b63; --felt: #243a80; --ink: #ffffff; --muted: #b9c4ea;
  --kid: #ffc93c; --kid-deep: #e89b00; --bot: #3ee0ff; --bot-deep: #0aa6c9; --bad: #ff5d6c; --good: #39d98a;
  --font: 'Rubik', 'Arial Hebrew', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100% } body { height: 100dvh }
body { margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 0%, #22357a 0%, var(--night) 60%); color: var(--ink); font-family: var(--font); direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 14px;
  -webkit-tap-highlight-color: transparent; user-select: none }
button { font: inherit; cursor: pointer }
.wrap { max-width: 860px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; gap: 8px }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.top .r { display: flex; gap: 6px; align-items: center }
.ib { font-size: 19px; background: rgba(255,255,255,.08); border: 0; color: #fff; border-radius: 12px; padding: 6px 10px; font-weight: 800 }
.ib[hidden] { display: none }
.back { font-size: 16px; padding: 8px 14px }
.streak { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: var(--muted) }
.streak .bar { width: 110px; height: 10px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden }
.streak .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--kid-deep), var(--kid)); border-radius: 99px; transition: width .4s }
.lvl { font-weight: 900; color: var(--kid); font-size: 16px; background: rgba(255,201,60,.12); border-radius: 99px; padding: 4px 12px }
.table { position: relative; flex: 1; background: radial-gradient(ellipse at 50% 50%, var(--felt), var(--table) 70%); border-radius: 30px;
  border: 4px solid #33498f; box-shadow: inset 0 0 60px rgba(0,0,0,.35), 0 20px 40px -20px rgba(0,0,0,.6);
  display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; min-height: 0; overflow: hidden }
/* 31.10 (אבירם: "לא ברור מי זה מי"): שני צדדים זה ליד זה. הילד מימין, הרובוט משמאל, לכל צד התמונה, השם, החפיסה והקלף שלו */
.arena { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; gap: clamp(6px, 2.5vw, 36px) }
.side { flex: 1; max-width: 360px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 22px; padding: 8px; position: relative }
.side.kid { background: rgba(255,201,60,.08); border: 2px solid rgba(255,201,60,.45) } .side.bot { background: rgba(62,224,255,.07); border: 2px solid rgba(62,224,255,.4) }
.who { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; width: 100% }
.who img { width: clamp(40px, 10vh, 84px); height: clamp(40px, 10vh, 84px); object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)) }
.who > b { font-weight: 900; font-size: 20px } .kid .who > b { color: var(--kid) } .bot .who > b { color: var(--bot) }
.side.glee .who img { animation: hop .5s } .side.sad .who img { animation: shake .5s }
.zone { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative }
.zone .bub.l { position: static; order: 2 }
.mid { flex-direction: column; justify-content: center; align-self: center }
.seat { display: flex; align-items: center; gap: 14px; width: 100%; justify-content: center; position: relative; z-index: 2 }
.seat img { width: clamp(44px, 10vh, 90px); height: clamp(44px, 10vh, 90px); object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)) }
.seat.glee img { animation: hop .5s } .seat.sad img { animation: shake .5s }
.deck { position: relative; width: clamp(40px, 7.5vh, 62px); aspect-ratio: 5 / 7; border: 0; padding: 0; background: none }
.deck i { position: absolute; inset: 0; border-radius: 9px; border: 3px solid #fff; box-shadow: 0 3px 6px rgba(0,0,0,.4) }
.deck i:nth-child(2) { transform: translate(-3px, -3px) } .deck i:nth-child(3) { transform: translate(-6px, -6px) }
.bot .deck i { background: repeating-linear-gradient(45deg, var(--bot-deep) 0 6px, var(--bot) 6px 12px) }
.kid .deck i { background: repeating-linear-gradient(45deg, var(--kid-deep) 0 6px, var(--kid) 6px 12px) }
.deck b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: #1b2440; z-index: 2; transform: translate(-6px, -6px) }
.kid .deck.tap { animation: pulse 1.1s ease-in-out infinite; cursor: pointer }
.kid .deck.tap::after { content: '👆'; position: absolute; font-size: 30px; inset-inline-start: 100%; top: 10%; animation: nudge 1s ease-in-out infinite }
.pile { font-weight: 900; font-size: 18px; min-width: 4.5em; text-align: center }
.bot .pile { color: var(--bot) } .kid .pile { color: var(--kid) }
.pile small { display: block; font-size: 12px; color: var(--muted); font-weight: 700 }
.zone { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 3; min-height: 0; height: 100% }
.card { width: min(24vh, 175px, 30vw); aspect-ratio: 5 / 7; border-radius: 16px; background: linear-gradient(#fff, #e9eefb); color: #1b2440;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 6px 0 #9fb0dd, 0 14px 24px -10px rgba(0,0,0,.6);
  position: relative; font-variant-numeric: tabular-nums; animation: flip .45s ease-out both }
.card .n { font-weight: 900; font-size: min(12vh, 88px, 15vw); line-height: 1 }
.card .dots { display: grid; grid-template-columns: repeat(5, auto); gap: 3px; justify-content: center; direction: ltr }
.card .dots i { width: min(1.6vh, 13px); height: min(1.6vh, 13px); border-radius: 50%; display: block }
.bot .card .dots i, .card.b .dots i { background: var(--bot-deep) } .card.k .dots i { background: var(--kid-deep) }
.card.b { border: 4px solid var(--bot) } .card.k { border: 4px solid var(--kid) }
.card.under { position: absolute; animation: none; opacity: .55; transform: translate(10px, 8px) rotate(6deg); z-index: -1 }
.card.go-k { animation: toKid .6s ease-in forwards } .card.go-b { animation: toBot .6s ease-in forwards }
.plus { font-weight: 900; font-size: min(7vh, 58px); color: #1b2440; background: linear-gradient(var(--kid), var(--kid-deep)); border-radius: 18px; padding: 4px 18px;
  box-shadow: 0 6px 0 #a86f00; direction: ltr; z-index: 3; transition: transform .3s }
.plus.up { animation: grow .9s ease-out }
.mid { display: flex; align-items: center; gap: 14px; z-index: 3 }
.pot { font-size: 14px; font-weight: 800; color: var(--muted); min-width: 5.5em; text-align: center }
.bub { position: absolute; z-index: 5; background: #fff; color: #1b2440; font-weight: 900; font-size: min(4.6vh, 30px); border-radius: 16px; padding: 6px 14px; white-space: nowrap;
  box-shadow: 0 6px 16px rgba(0,0,0,.4); direction: ltr; animation: pop .3s ease-out both }
.bub[hidden] { display: none }
.bub.l { inset-inline-start: calc(50% + min(8vh, 75px) + 14px) }
.bub.bad { background: #ffd0d5; text-decoration: line-through; text-decoration-color: var(--bad) }
.bub.ok { background: #d4f8e5 }
.hear { font-size: 16px; font-weight: 700; color: var(--muted); min-height: 1.3em; text-align: center; direction: rtl }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; z-index: 4 }
.mic { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; color: #fff; background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 16px 6px 10px }
.mic[hidden] { display: none }
.mic .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--bad); display: grid; place-items: center; font-size: 18px; animation: rec 1.1s ease-in-out infinite }
.pad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; width: min(640px, 100%); direction: ltr }
.pad[hidden] { display: none }
.pad button { font-weight: 900; font-size: min(4.2vh, 28px); color: #1b2440; background: linear-gradient(#fff, #e7ecfb); border: 0; border-radius: 12px; padding: 6px 0; box-shadow: 0 4px 0 #9fb0dd }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #9fb0dd }
.catch { font-weight: 900; font-size: min(5vh, 32px); color: #fff; background: linear-gradient(#ff7a86, #e23a4b); border: 0; border-radius: 999px; padding: 10px 30px;
  box-shadow: 0 6px 0 #9b1f2c; animation: pulse .8s ease-in-out infinite }
.judge { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap }
.judge[hidden] { display: none }
.judge::before { content: 'הרובוט צדק?'; width: 100%; text-align: center; font-weight: 800; color: var(--muted); font-size: 15px }
.okb { font-weight: 900; font-size: min(4.4vh, 28px); color: #fff; background: linear-gradient(#4be39b, #1fae6a); border: 0; border-radius: 999px; padding: 10px 26px; box-shadow: 0 6px 0 #137447 }
.over { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; text-align: center;
  background: rgba(10,16,40,.9); backdrop-filter: blur(4px); padding: 20px; overflow-y: auto }
.over[hidden] { display: none }
#start { position: fixed; background: radial-gradient(circle at 50% 0%, #22357a 0%, var(--night) 60%) }
.over h1 { margin: 0; font-size: clamp(32px, 8vw, 54px); font-weight: 900; line-height: 1.1; text-wrap: balance }
.over h1 span { color: var(--kid); direction: ltr; unicode-bidi: isolate; display: inline-block }
.over p { margin: 0; font-size: 18px; color: var(--muted); max-width: 28em; line-height: 1.5; text-wrap: pretty }
.over .big { font-size: 90px; line-height: 1 }
.rules { display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 12px 18px; text-align: right; font-size: 17px; line-height: 1.45; max-width: 30em }
.lv { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center }
.lv > b { font-size: 16px; color: var(--muted) }
.lv button { font-weight: 900; font-size: 19px; color: #fff; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18); border-radius: 999px; padding: 7px 16px; direction: ltr }
.lv button[aria-pressed="true"] { background: var(--kid); color: #1b2440; border-color: var(--kid) }
.go { font-weight: 900; font-size: 28px; color: #1b2440; background: linear-gradient(var(--kid), var(--kid-deep)); border: 0; border-radius: 999px; padding: 14px 40px;
  box-shadow: 0 7px 0 #a86f00, 0 16px 30px -12px rgba(0,0,0,.6); animation: pulse 1.4s ease-in-out infinite }
.sec { font-weight: 800; font-size: 17px; color: #fff; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 999px; padding: 9px 20px }
.note { font-size: 14px !important; max-width: 32em }
.toast { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: clamp(30px, 8vw, 54px); font-weight: 900; z-index: 8; pointer-events: none; animation: rise 1.2s ease-out forwards; white-space: nowrap; text-shadow: 0 4px 0 rgba(0,0,0,.35) }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 20 }
@keyframes hop { 30% { transform: translateY(-18px) scale(1.08) } 60% { transform: translateY(0) } }
@keyframes shake { 20%, 60% { transform: translateX(-8px) } 40%, 80% { transform: translateX(8px) } }
@keyframes flip { from { transform: rotateY(90deg) scale(.8) } }
@keyframes toKid { to { transform: translate(28vw, -20vh) scale(.3) rotate(14deg); opacity: 0 } }
@keyframes toBot { to { transform: translate(-28vw, -20vh) scale(.3) rotate(-14deg); opacity: 0 } }
@keyframes pulse { 50% { transform: scale(1.06) } }
@keyframes nudge { 50% { transform: translateX(-8px) } }
@keyframes rec { 50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(255,93,108,.25) } }
@keyframes pop { from { transform: scale(.4); opacity: 0 } }
@keyframes grow { 30% { transform: scale(1.5) rotate(-6deg) } 60% { transform: scale(.9) } }
@keyframes rise { from { transform: translate(-50%, -30%) scale(.6); opacity: 0 } 25% { transform: translate(-50%, -50%) scale(1.1); opacity: 1 } to { transform: translate(-50%, -110%); opacity: 0 } }
@media (max-height: 600px) { .card .dots { display: none } .over .big { display: none } .rules { font-size: 15px } .over p { font-size: 15px } }
@media (max-width: 520px) { .streak .bar { width: 70px } .pad { grid-template-columns: repeat(5, 1fr) } .bub { font-size: 19px; padding: 4px 8px } .plus { font-size: 30px; padding: 2px 10px } .who b { font-size: 16px } .pile small { display: none } .side { padding: 6px 4px } .who { display: grid; grid-template-columns: auto auto; grid-template-areas: "i i" "n n" "d p"; justify-content: center; justify-items: center; align-items: center; gap: 2px 10px } .who img { grid-area: i; width: 64px; height: 64px } .who > b { grid-area: n; font-size: 18px } .who .deck { grid-area: d } .who .pile { grid-area: p } .deck { width: 32px } .pile { min-width: 0; font-size: 20px } }
@media (max-height: 520px) { .who img { width: 38px; height: 38px } .deck { width: 32px } .card { width: min(20vh, 30vw) } .bub { font-size: 20px; padding: 4px 10px } .catch, .okb { font-size: 20px; padding: 6px 18px } .judge::before { display: none } .hear { min-height: 0 } }
@media (prefers-reduced-motion: reduce) { .go, .kid .deck.tap, .catch { animation: none } }
</style></head><body>
