<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מחולל האימונים · מועדון הדור הבא</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* דף הכניסה: כותרת כחולה, כרטיס לבן אחד עם שלב אחד בכל פעם. אותם צבעים כמו המחולל */
:root {
  --bg: #e3e8f2; --mist: #b4c1dc; --surface: #ffffff; --ink: #14203d; --muted: #5a6683; --line: #dde3ef;
  --navy: #1b2a52; --gold: #c99a2e; --gold-btn: #e2b74e; --warn: #b4442f; --ok: #1f8a5b;
  --display: 'Secular One', 'Assistant', 'Arial Hebrew', Arial, sans-serif;
  --body: 'Assistant', 'Arial Hebrew', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1428; --mist: #101a38; --surface: #151f3a; --ink: #eef1f9; --muted: #a3aec9; --line: #2a3657; --navy: #0a1022; --warn: #f08a72; --ok: #4cc28d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1428; --mist: #101a38; --surface: #151f3a; --ink: #eef1f9; --muted: #a3aec9; --line: #2a3657; --navy: #0a1022; --warn: #f08a72; --ok: #4cc28d; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background-color: var(--bg); background-image: radial-gradient(600px 300px at 85% -60px, rgba(230,187,82,.25), transparent 62%), linear-gradient(180deg, #101c40 0, #192c5f 200px, #2a4180 300px, var(--mist) 470px, var(--bg) 700px); background-repeat: no-repeat; background-size: 100% 700px; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 48px }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
.hero { color: #fff; padding: 30px 22px 8px; text-align: center }
.hero .logo { width: 96px; height: 96px; border-radius: 50%; background: #fff; padding: 4px; display: block; margin: 0 auto 10px; box-shadow: 0 0 0 3px #e6bb52, 0 12px 28px -10px rgba(0,0,0,.6) }
.hero .club { font-weight: 700; color: #e2b74e; letter-spacing: .04em; font-size: 15px }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 40px); line-height: 1.15; margin: 6px 0 8px }
.hero p { margin: 0; color: #d7def0; text-wrap: balance }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 26px 50px -30px rgba(15,25,52,.55); padding: 24px 22px; display: flex; flex-direction: column; gap: 14px }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.25 }
.card p { margin: 0 }
.muted { color: var(--muted); font-size: 15px }
label { font-weight: 800 }
input { font: inherit; font-size: 19px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100% }
input.ltr { direction: ltr; text-align: left }
input.code { letter-spacing: .4em; text-align: center; font-size: 26px; font-variant-numeric: tabular-nums }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.go { font: inherit; font-weight: 800; font-size: 19px; color: #14203d; background: var(--gold-btn); border: 0; border-radius: 14px; padding: 14px; cursor: pointer; min-height: 52px }
.go[disabled] { opacity: .6; cursor: wait }
.link { font: inherit; color: var(--ink); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 6px 0; text-align: start; font-size: 15px }
.err { color: var(--warn); font-weight: 700; margin: 0 }
.err a { color: inherit }
.good { color: var(--ok); font-weight: 700 }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line) }
#gbtn { display: flex; justify-content: center; min-height: 44px }
.load { text-align: center; padding: 36px 22px }
.spin { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--gold-btn); animation: s 0.9s linear infinite }
@keyframes s { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s } }
.f { text-align: center; color: var(--muted); font-size: 14px }
.pw { position: relative }
.pw input { padding-inline-end: 56px }
.eye { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; cursor: pointer; font-size: 22px; line-height: 1; color: var(--muted) }
.eye:hover { background: var(--line) }
[hidden] { display: none !important }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="r/club-logo.png" alt="מועדון הדור הבא" width="96" height="96">
    <div class="club">מועדון הדור הבא</div>
    <h1>מחולל האימונים</h1>
    <p>שבוע אימונים אישי לילד שלכם.<br>בדקה אחת, בלי מאבק.</p>
  </header>

  <main class="card" id="card" aria-live="polite">
    <div class="load"><div class="spin" aria-hidden="true"></div><p>רגע, פותחים...</p></div>
  </main>

  <footer class="f">אבירם היכל - העוצמה בחינוך</footer>
</div>

<script>
(function () {
  'use strict';
  var API = "https://script.google.com/macros/s/AKfycbx9VEANkpfuMCsm3b2cQ2Y2oO7zpYqWBzh0WGQCb6dGzxj4eoNbY8PcjLfmzz9ZX1y_eg/exec";            // כתובת החלק שבענן (Apps Script)
  var BIN = "g-7b06f9d774.bin";            // המחולל המוצפן
  var GOOGLE_ID = "";   // ריק = בלי כפתור גוגל
  var KEY_PARENT_H = 24, KEY_KID_D = 7;

  var card = document.getElementById('card');
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function post(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  var MSG = {
    email: 'המייל לא נראה תקין. בדקו ונסו שוב.',
    pwbad: 'הסיסמה לא נכונה. נסו שוב, או לחצו "שכחתי סיסמה".',
    nopw: 'עוד לא נקבעה סיסמה למייל הזה. שלחנו לכם קוד.',
    locked: 'היו יותר מדי ניסיונות. נסו שוב בעוד 15 דקות, או קבלו קוד למייל.',
    codebad: 'הקוד לא נכון. בדקו שוב במייל.',
    codeold: 'הקוד כבר לא בתוקף. בקשו קוד חדש.',
    toomany: 'כבר שלחנו כמה קודים בשעה האחרונה. חפשו במייל (גם בספאם ובקידומי מכירות), או נסו שוב בעוד שעה.',
    pwshort: 'הסיסמה צריכה לפחות 6 תווים.',
    google: 'הכניסה עם גוגל לא הצליחה. נסו שוב, או היכנסו עם המייל.',
    server: 'משהו השתבש אצלנו. נסו שוב בעוד רגע.',
    soon: 'מחולל האימונים עוד רגע נפתח למנויי המועדון 🚀',
    net: 'אין חיבור כרגע. בדקו את האינטרנט ונסו שוב.',
    kicked: 'נותקתם במכשיר הזה, כי נכנסו לחשבון ממכשיר אחר. אפשר להיכנס בכל מכשיר עד 3 מכשירים, ומכשיר רביעי מנתק את הישן ביותר.',
  };
  function notMember(r) {
    return 'המייל הזה לא מופיע אצלנו ברשימת המנויים של המועדון.<br>' +
      'אולי נרשמתם עם מייל אחר? נסו אותו.<br>' +
      'צריכים עזרה? כתבו לנו בקבוצת הווטסאפ האישית שלכם.' +
      (r && r.join ? '<br><a href="' + esc(r.join) + '" target="_blank" rel="noopener">עדיין לא במועדון? להצטרפות</a>' : '');
  }
  // 👁️ אבירם 29.10: עין שמראה את הסיסמה
  var EYE = '<button type="button" class="eye" aria-label="להציג את הסיסמה" title="להציג את הסיסמה">👁️</button>';
  card.addEventListener('click', function (e) {
    var b = e.target.closest('.eye'); if (!b) return;
    var inp = b.parentNode.querySelector('input'), show = inp.type === 'password';
    inp.type = show ? 'text' : 'password'; b.textContent = show ? '🙈' : '👁️';
    b.setAttribute('aria-label', show ? 'להסתיר את הסיסמה' : 'להציג את הסיסמה'); b.title = b.getAttribute('aria-label');
  });
  function ended(r) {
    return 'המנוי שלכם למועדון הסתיים, ולכן מחולל האימונים נסגר.<br>רוצים לחזור? נשמח מאוד 💙' +
      (r && r.join ? '<br><a href="' + esc(r.join) + '" target="_blank" rel="noopener">לחזרה למועדון</a>' : '');
  }
  function errText(r) { return r && r.why === 'notmember' ? notMember(r) : r && r.why === 'ended' ? ended(r) : esc(MSG[r && r.why] || MSG.server); }
  function closed(r) { return r && /^(out|notmember|ended|kicked)$/.test(r.why); }

  // ---------- פתיחת המחולל המוצפן ----------
  var stop = false; // בדיקה ברקע גילתה שהגישה נסגרה: לא פותחים, טוענים מחדש
  function reload() { stop = true; location.reload(); }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function run(key) {
    loading('פותחים את המחולל...');
    return fetch(BIN).then(function (r) { if (!r.ok) throw new Error('bin'); return r.arrayBuffer(); }).then(function (buf) {
      var u = new Uint8Array(buf);
      return crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt'])
        .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, k, u.slice(12)); });
    }).then(function (plain) {
      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(function (html) {
      if (stop) return;
      document.open(); document.write(html); document.close();
    });
  }

  // ---------- מצב ילד: קישור מההורה ----------
  var kt = (location.hash.match(/[#&]t=([0-9a-f]{20,})/) || [])[1];
  var kidMode = /[#&]k=[\w-]+/.test(location.hash) && kt;
  var acct = store.get('club-acct'), kc = store.get('club-key');
  // 🛡️ מזהה המכשיר (לקישור הילד: עד 2 מכשירים לכל ילד)
  var dev = store.get('club-dev');
  if (!/^[a-z0-9]{12,40}$/.test(dev || '') && window.crypto && crypto.getRandomValues) { dev = ''; var rb = crypto.getRandomValues(new Uint8Array(12)); for (var ri = 0; ri < rb.length; ri++) dev += ('0' + rb[ri].toString(16)).slice(-2); store.set('club-dev', dev); }
  function kidAsk() { return { a: 'kid', kt: kt, d: dev, t: acct && acct.t || undefined }; }

  function kidStart() {
    var fresh = kc && kc.kt === kt && Date.now() - kc.at < KEY_KID_D * 864e5;
    if (fresh) { run(kc.k).catch(kidFail); post(kidAsk()).then(function (r) { if (!r.ok && (r.why === 'kid' || r.why === 'kiddev')) { store.del('club-key'); reload(); } }, function () {}); return; }
    loading('פותחים את האימון...');
    post(kidAsk()).then(function (r) {
      if (!r.ok) return kidFail(r);
      store.set('club-key', { k: r.key, at: Date.now(), kt: kt }); return run(r.key);
    }).catch(kidFail);
  }
  function kidFail(r) {
    if (r && r.why === 'kiddev') { card.innerHTML = '<h2>הקישור כבר פתוח במכשירים אחרים 📱</h2><p>אפשר לפתוח את האימון עד 2 מכשירים לכל ילד.</p><p class="muted">הורים: במחולל האימונים, ב"הגדרות נוספות", יש כפתור "איפוס מכשירים". לוחצים, ופותחים את הקישור כאן שוב.</p>'; return; }
    card.innerHTML = '<h2>הקישור הזה כבר לא פעיל 🙈</h2><p>בקשו מאמא או מאבא קישור חדש לאימון.</p>';
  }

  // ---------- הורה ----------
  function parentStart() {
    var why = store.get('club-why'); store.del('club-why');
    if (!(acct && acct.t)) return why && why.why !== 'out' ? askEmail(why.email || '', why) : askEmail();
    var fresh = kc && !kc.kt && Date.now() - kc.at < KEY_PARENT_H * 36e5;
    if (fresh) { run(kc.k).catch(function () { store.del('club-key'); askEmail(); }); revalidate(); return; }
    loading('בודקים את המנוי...');
    post({ a: 'me', t: acct.t }).then(function (r) {
      if (!r.ok) { var em0 = acct.email; signOut(); return /^(notmember|ended|kicked)$/.test(r.why) ? askEmail(em0, r) : askEmail(em0); }
      keep(r, acct.t); return run(r.key);
    }).catch(function () { netRetry(parentStart); });
  }
  function revalidate() {
    post({ a: 'me', t: acct.t }).then(function (r) {
      if (r.ok) { var a = store.get('club-acct') || acct; a.kt = r.kt; a.fam = r.fam || ''; a.devs = r.devs; a.devMax = r.devMax; store.set('club-acct', a); store.set('club-key', { k: r.key, at: Date.now() }); return; }
      if (closed(r)) { store.set('club-why', { why: r.why, join: r.join, email: acct.email }); signOut(); reload(); }
    }, function () {});
  }
  function keep(r, t) {
    acct = { api: API, t: t, email: r.email, kids: r.kids || [], kt: r.kt, fam: r.fam || '', devs: r.devs, devMax: r.devMax };
    store.set('club-acct', acct); store.set('club-key', { k: r.key, at: Date.now() });
  }
  function signOut() { store.del('club-acct'); store.del('club-key'); acct = null; }
  function signedIn(r) {
    if (!r.ok) return false;
    keep(r, r.t); run(r.key).catch(function () { show('<p class="err">' + MSG.server + '</p>'); });
    return true;
  }

  // ---------- המסכים ----------
  function loading(t) { card.innerHTML = '<div class="load"><div class="spin" aria-hidden="true"></div><p>' + esc(t) + '</p></div>'; }
  function netRetry(fn) {
    card.innerHTML = '<p class="err">' + MSG.net + '</p><button class="go" type="button" id="again">לנסות שוב</button>';
    document.getElementById('again').onclick = fn;
  }
  function busy(form, on) { var b = form.querySelector('.go'); b.disabled = on; if (on) b.dataset.t = b.textContent, b.textContent = 'רגע...'; else if (b.dataset.t) b.textContent = b.dataset.t; }
  function show(html) { var e = card.querySelector('.err'); if (e) { e.innerHTML = html.replace(/^<p class="err">|<\/p>$/g, ''); e.hidden = false; } }

  function askEmail(email, why) {
    card.innerHTML =
      '<h2>כניסה למנויי המועדון</h2>' +
      '<p class="muted">כתבו את המייל שאיתו נרשמתם למועדון.</p>' +
      (GOOGLE_ID ? '<div id="gbtn"></div><div class="or">או עם המייל</div>' : '') +
      '<form id="fe" novalidate><label for="em">המייל שלכם</label>' +
      '<input class="ltr" id="em" type="email" inputmode="email" autocomplete="email" dir="ltr" required value="' + esc(email || '') + '">' +
      '<p class="err" id="er" ' + (why ? '' : 'hidden') + '>' + (why ? errText(why) : '') + '</p>' +
      '<button class="go" type="submit">המשך</button></form>';
    var f = document.getElementById('fe');
    f.style.display = 'flex'; f.style.flexDirection = 'column'; f.style.gap = '12px';
    if (!email) setTimeout(function () { document.getElementById('em').focus(); }, 50);
    f.onsubmit = function (e) {
      e.preventDefault();
      var em = document.getElementById('em').value.trim().toLowerCase(), er = document.getElementById('er');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { er.innerHTML = MSG.email; er.hidden = false; return; }
      busy(f, true);
      post({ a: 'start', email: em }).then(function (r) {
        busy(f, false);
        if (!r.ok) { er.innerHTML = errText(r); er.hidden = false; return; }
        if (r.next === 'password') askPassword(em); else askCode(em);
      }, function () { busy(f, false); er.innerHTML = MSG.net; er.hidden = false; });
    };
    if (GOOGLE_ID) googleButton();
  }

  function askPassword(em) {
    card.innerHTML =
      '<h2>שלום שוב 👋</h2><p class="muted" dir="ltr" style="text-align:right">' + esc(em) + '</p>' +
      '<form id="fp"><label for="pw">הסיסמה שלכם למחולל</label>' +
      '<div class="pw"><input id="pw" type="password" autocomplete="current-password" required>' + EYE + '</div>' +
      '<p class="err" id="er" hidden></p>' +
      '<button class="go" type="submit">כניסה</button></form>' +
      '<button class="link" type="button" id="forgot">שכחתי סיסמה, שלחו לי קוד למייל</button>' +
      '<button class="link" type="button" id="other">כניסה עם מייל אחר</button>';
    var f = document.getElementById('fp'), er = document.getElementById('er');
    f.style.display = 'flex'; f.style.flexDirection = 'column'; f.style.gap = '12px';
    setTimeout(function () { document.getElementById('pw').focus(); }, 50);
    f.onsubmit = function (e) {
      e.preventDefault(); busy(f, true);
      post({ a: 'login', email: em, pw: document.getElementById('pw').value }).then(function (r) {
        busy(f, false);
        if (!signedIn(r)) { er.innerHTML = errText(r); er.hidden = false; if (r.why === 'nopw') askCode(em); }
      }, function () { busy(f, false); er.innerHTML = MSG.net; er.hidden = false; });
    };
    document.getElementById('forgot').onclick = function () {
      loading('שולחים קוד למייל...');
      post({ a: 'code', email: em }).then(function (r) { if (r.ok) askCode(em, true); else askEmail(em, r); }, function () { netRetry(function () { askPassword(em); }); });
    };
    document.getElementById('other').onclick = function () { askEmail(''); };
  }

  function askCode(em, reset) {
    card.innerHTML =
      '<h2>' + (reset ? 'קובעים סיסמה חדשה' : 'פעם ראשונה כאן? מעולה 🎉') + '</h2>' +
      '<p>שלחנו קוד בן 6 ספרות אל:<br><b dir="ltr">' + esc(em) + '</b></p>' +
      '<p class="muted">לא מגיע? חפשו גם בספאם ובקידומי מכירות.</p>' +
      '<form id="fc"><label for="cd">הקוד מהמייל</label>' +
      '<input class="code" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>' +
      '<label for="np">' + (reset ? 'סיסמה חדשה' : 'בחרו סיסמה למחולל') + '</label>' +
      '<div class="pw"><input id="np" type="password" autocomplete="new-password" minlength="6" required>' + EYE + '</div>' +
      '<p class="muted" style="margin-top:-6px">לפחות 6 תווים. איתה תיכנסו בפעמים הבאות.</p>' +
      '<p class="err" id="er" hidden></p>' +
      '<button class="go" type="submit">כניסה למחולל 🚀</button></form>' +
      '<button class="link" type="button" id="resend">שלחו לי קוד חדש</button>' +
      '<button class="link" type="button" id="other">כניסה עם מייל אחר</button>';
    var f = document.getElementById('fc'), er = document.getElementById('er');
    f.style.display = 'flex'; f.style.flexDirection = 'column'; f.style.gap = '12px';
    setTimeout(function () { document.getElementById('cd').focus(); }, 50);
    f.onsubmit = function (e) {
      e.preventDefault();
      var code = document.getElementById('cd').value.replace(/\D/g, ''), pw = document.getElementById('np').value;
      if (code.length !== 6) { er.innerHTML = MSG.codebad; er.hidden = false; return; }
      if (pw.length < 6) { er.innerHTML = MSG.pwshort; er.hidden = false; return; }
      busy(f, true);
      post({ a: 'verify', email: em, code: code, pw: pw }).then(function (r) {
        busy(f, false);
        if (!signedIn(r)) { er.innerHTML = errText(r); er.hidden = false; }
      }, function () { busy(f, false); er.innerHTML = MSG.net; er.hidden = false; });
    };
    document.getElementById('resend').onclick = function () {
      post({ a: 'code', email: em }).then(function (r) {
        er.hidden = false; er.className = r.ok ? 'good' : 'err'; er.innerHTML = r.ok ? '✔ שלחנו קוד חדש' : errText(r);
      }, function () { er.innerHTML = MSG.net; er.hidden = false; });
    };
    document.getElementById('other').onclick = function () { askEmail(''); };
  }

  function googleButton() {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({ client_id: GOOGLE_ID, callback: function (res) {
        loading('בודקים את המנוי...');
        post({ a: 'google', cred: res.credential }).then(function (r) { if (!signedIn(r)) askEmail(r.email || '', r); }, function () { netRetry(function () { askEmail(''); }); });
      } });
      var g = document.getElementById('gbtn');
      if (g) google.accounts.id.renderButton(g, { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', locale: 'he', width: 300 });
    };
    document.head.appendChild(s);
  }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    card.innerHTML = '<h2>הדפדפן הזה ישן מדי 😕</h2><p>פתחו את הקישור בכרום או בספארי מעודכנים.</p>';
    return;
  }
  if (kidMode) kidStart(); else parentStart();
})();
</script>
</body>
</html>
