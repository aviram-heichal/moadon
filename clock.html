<!doctype html>
<html lang="he" dir="rtl">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ללמוד שעון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a4a;--navy2:#2c4170;--gold:#d4a537;--gold2:#f3d27a;--cream:#fffaf0;--ok:#2e9d5b;--soft:#eef2fa;--txt:#1b2a4a;--card:#ffffff;--hint:#e8574d}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--cream);color:var(--txt);font-family:Rubik,Arial,sans-serif;font-size:19px}
button{font-family:inherit}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--navy);color:#fff;padding:10px 16px}
#top .t{font-weight:800;font-size:20px}
#ctlbar{position:sticky;top:52px;z-index:19;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:#eef2fa;padding:7px 10px;border-bottom:1px solid #d6deee}
#ctlbar .lbl{font-size:16px;font-weight:700;color:var(--navy)}
#ctlbar .rate{background:#fff;border:2px solid #c5cfe3;color:var(--navy);border-radius:12px;padding:6px 12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
#ctlbar .rate.on{background:var(--navy);border-color:var(--navy);color:#fff}
#skipBtn{background:var(--gold);border:0;color:var(--navy);border-radius:12px;padding:7px 14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-inline-start:6px}
.back{background:#fff;color:var(--navy);border:0;border-radius:12px;padding:8px 14px;font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap}
.back[hidden]{display:none}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 22px rgba(27,42,74,.10);padding:20px;margin:12px 0;text-align:center}
h1{font-size:34px;margin:6px 0 4px;font-weight:900}
h2{font-size:26px;margin:4px 0 10px;font-weight:800}
.sub{font-size:19px;color:#4a5a7a;margin:4px 0 12px}
.def{font-size:25px;font-weight:800;color:var(--navy);line-height:1.55;margin:8px 0 10px}
@media (max-width:480px){.def{font-size:21px}}
.big{font-size:30px;font-weight:900;margin:10px 0;min-height:42px}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:16px;padding:14px 26px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #a97f1d;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a97f1d}
.btn.sec{background:var(--soft);box-shadow:0 4px 0 #c5cfe3}
.btn.small{font-size:17px;padding:9px 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:#fff;border:3px solid #d6deee;border-radius:18px;padding:16px 8px;font-size:25px;font-weight:800;color:var(--navy);cursor:pointer}
.opt.good{background:#dff5e7;border-color:var(--ok)}
.opt.bad{background:#fdeceb;border-color:#e8a39e;opacity:.7}
.clockwrap{position:relative;width:min(100%,380px,42vh);min-width:220px;margin:6px auto}
.clockwrap svg{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.clockwrap.big1{width:min(100%,400px,46vh)}
.clockwrap,.clockwrap *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* תרגול: הכל במסך אחד. מחשב/טאבלט: השעון בצד אחד, השאלה + הכפתורים + "בדוק" בצד השני */
.pgrid{display:flex;flex-direction:column;align-items:stretch}
.pgrid .pside{display:flex;flex-direction:column}
@media (min-width:640px){
  .pgrid{display:grid;grid-template-columns:1.2fr 1fr;grid-template-areas:"c q" "c s";gap:4px 16px;align-items:start}
  .pgrid #say{grid-area:q;margin-top:18px}
  .pgrid #clk{grid-area:c}
  .pgrid .pside{grid-area:s}
  .pgrid .opt{font-size:22px;padding:14px 6px}
  .pgrid .clockwrap{width:min(100%,380px,56vh)}
  .pgrid .twoclk .clockwrap{width:100%}
  #app.wide{max-width:980px}
}
@media (max-width:639px){.pgrid .clockwrap{width:min(100%,300px,34vh);min-width:160px}.pgrid .twoclk .clockwrap{width:100%}.pgrid .opt{padding:10px 6px;font-size:21px}.pgrid .big{font-size:23px;margin:4px 0}}
.peanut{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.hello{display:flex;align-items:center;gap:12px;justify-content:center}
.bounce{animation:bn .7s ease}
@keyframes bn{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(5deg)}100%{transform:scale(1)}}
.stages{display:grid;gap:10px;margin-top:10px}
.stage{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #e2e8f4;border-radius:18px;padding:14px;cursor:pointer;text-align:right;font-size:20px;font-weight:700;color:var(--navy)}
.stage .n{width:42px;height:42px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.stage.done{border-color:var(--ok)}
.stage.done .n{background:var(--ok);color:#fff}
.stage small{display:block;font-weight:400;color:#5b6b8a;font-size:16px}
.dots{display:flex;gap:7px;justify-content:center;margin:8px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#dbe2ef}
.dot.on{background:var(--ok)}
.dot.x{background:#f0b5b0}
.label{display:inline-block;background:var(--navy);color:#fff;border-radius:14px;padding:8px 18px;font-size:28px;font-weight:900;margin:8px 0;min-width:200px}
.label.gold{background:var(--gold);color:var(--navy)}
.tip{background:#fff6dc;border:2px dashed var(--gold);border-radius:16px;padding:12px;margin:10px 0;font-size:19px}
.replay{background:none;border:0;font-size:17px;color:var(--navy2);cursor:pointer;text-decoration:underline;margin-top:6px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;width:12px;height:16px;border-radius:3px;top:-20px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.minbar{height:22px;background:var(--soft);border-radius:12px;overflow:hidden;margin:12px 0}
.minbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.gender{display:flex;gap:10px;justify-content:center;margin:10px 0}
.gender .btn{min-width:120px}
.gender .btn.on{outline:4px solid var(--navy)}
input.name{font-family:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #d6deee;text-align:center;width:min(80vw,300px)}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.ltab{background:var(--soft);border:3px solid transparent;border-radius:14px;padding:8px 4px;font-family:inherit;font-size:17px;font-weight:800;color:var(--navy);cursor:pointer}
.ltab small{display:block;font-size:13px;font-weight:600;color:#5b6b8a}
.ltab.on{background:#fff;border-color:var(--gold)}
.twoclk{display:flex;gap:10px;justify-content:center;align-items:flex-start}
.twoclk>div{flex:1;min-width:0;max-width:330px}
.twoclk .clockwrap{width:100%;min-width:0}
.cap{font-size:17px;font-weight:800;margin-top:2px}
.cap.h{color:var(--navy)}.cap.m{color:#2f6fd6}
.nudge{display:flex;gap:8px;justify-content:center;margin-top:6px}
.nudge .btn{font-size:17px;padding:8px 14px}
#tapSound{position:fixed;inset:0;z-index:60;background:rgba(27,42,74,.55);display:flex;align-items:center;justify-content:center}
#tapSound[hidden]{display:none}
.mergefly{transition:transform 1.6s ease,opacity 1.6s ease}
@media (max-width:480px){.ltab{font-size:15px}.ltab small{font-size:11px}.cap{font-size:15px}}
@media (max-width:480px){#top .t{font-size:17px}.back{font-size:15px;padding:7px 10px}.card{padding:14px}#app{padding:10px 12px 50px}h1{font-size:28px}.opt{font-size:22px;padding:14px 6px}.big{font-size:25px}.label{font-size:24px}}
</style>
</head>
<body>
<div id="top"><button class="back" id="backBtn">→ חזרה</button><div class="t">🕐 ללמוד שעון</div></div>
<div id="ctlbar"><span class="lbl">🔊 מהירות דיבור:</span><button class="rate" data-r="0.8">לאט</button><button class="rate" data-r="1">רגיל</button><button class="rate" data-r="1.2">1.2</button><button class="rate" data-r="1.5">1.5</button><button id="skipBtn">⏭ דלג</button></div>
<div id="app"></div>
<div id="conf"></div>
<div id="tapSound" hidden><button class="btn" id="tapSoundBtn" style="font-size:26px;padding:20px 34px">🔊 לחצו כאן כדי לשמוע</button></div>

    qHtml: 'הזיזו את מחוג הדקות ל: <span class="label gold">' + fmtM(m) + '</span><div class="sub" style="margin:4px 0 0">ואז השעה תהיה: ' + fmtT(H, m) + '</div>', a: sayT(H, m),
    ok: function (cs) { return Mof(cs.t) === m; },
    tip: function (cs) { var now = Mof(cs.t); return '👀 עכשיו המחוג על ' + fmtM(now) + '. צריך ' + fmtM(m) + (m % 5 ? ' (בחמישיות עד ' + (Math.floor(m / 5) * 5) + ', ועוד ' + (m % 5) + ')' : '') + '. אפשר לתקן עם הכפתורים.'; } };
}
function tDragBoth(H, m, hq, intro) {   // שעון אחד: מזיזים את שני המחוגים
  var st; do { st = rnd(0, 719); } while (Math.abs(st - tOf(H, m)) < 90);
  return { kind: 'drag', key: 'D' + H + ':' + m, t: st, q: (intro ? ['drg3'] : []).concat(['drgQ3']).concat(sayT(H, m, hq)),
    qHtml: 'הזיזו את המחוגים ל: <span class="label gold">' + fmtT(H, m, hq) + '</span>', a: sayT(H, m, hq),
    ok: function (cs) { return Mof(cs.t) === m && Hof(cs.t) === H; },
    onWrong: function (cs) { cs.c.outer(true); },
    tip: function (cs) {
      var mm = Mof(cs.t), okM = mm === m;
      var where = m === 0 ? 'למעלה, על 12' : m % 5 === 0 ? 'על המספר ' + (m / 5) + ' (' + fmtM(m) + ')' : 'על ' + fmtM(m);
      return '👀 ' + (okM ? 'מחוג הדקות במקום ✓. ' : 'מחוג הדקות (הארוך) צריך להיות ' + where + '. ') + (Hof(cs.t) === H ? 'מחוג השעות במקום ✓' : 'מחוג השעות צריך להיות ' + (m === 0 ? 'בדיוק על ' + H : 'אחרי ' + H + ', לפני ' + wrap(H + 1)) + '.') + ' אפשר גם לגרור את מחוג השעות לבד.';
    } };
}
function tTap(want) {
  var H, m; do { H = HB(); m = rnd(0, 11) * 5; } while (angd(m, (tOf(H, m) / 12) % 60) < 12);
  return { kind: 'tap', key: want + H + m, t: tOf(H, m), want: want, q: [want === 'h' ? 'whQh' : 'whQm'], qText: want === 'h' ? 'תיגעו ב<b>מחוג השעות</b> (הקצר)' : 'תיגעו ב<b>מחוג הדקות</b> (הארוך, הכחול)',
    tip: want === 'h' ? '👀 מחוג השעות הוא הקצר והעבה, עם החץ הצהוב.' : '👀 מחוג הדקות הוא הארוך והכחול.' };
}
function tNums(n, outer) {
  var m = n * 5, H = hourNot(n);
  return { kind: 'choice', key: 'n' + n, t: tOf(H, m), q: ['nmQ'], qText: 'כמה דקות?', ans: fmtM(m), outer: outer,
    opts: opts4(fmtM(m), [fmtM(n), fmtM(m + 5), fmtM(n * 10 < 60 ? n * 10 : m - 5), fmtM(m > 5 ? m - 5 : m + 10)]), a: ['c' + m],
    tip: function () { return '👀 מחוג הדקות על המספר ' + n + '. כל מספר = 5 דקות: ' + n + ' × 5 = ' + fmtM(m) + '.'; },
    onWrong: function (cs) { cs.c.outer(true); cs.c.sector(0, m); } };
}

/* ---------- שיעור 2: שעון הדקות ---------- */
function s2Clock(i) {
  // הערת אבירם 18.11: קודם שעון עם שני המחוגים ("בשעון יש עוד מחוג"), ואז מסתכלים רק על מחוג הדקות. 0 למעלה, ו-60 = שוב 0
  demo(i, 'one', tOf(4, 10), async function (cs, L, rebuild) {
    L('מחוג השעות + מחוג הדקות'); cs.c.glow('h', true); var p = say('mc0'); await wait(2600); cs.c.glow('h', false); cs.c.glow('m', true); await p; await wait(300); cs.c.glow('m', false);
    L('רק מחוג הדקות', true); await say('mc0b');
    var c = rebuild('min', 0);
    L('שעון הדקות'); c.mc.glow('m', true); await say('mc1'); c.mc.glow('m', false);
    c.mc.sector(0, 1); L('קו אחד = דקה אחת'); await say('mc2'); c.mc.sector(null);
    c.mc.mark(12); L('למעלה: 0 דקות', true); await say('mcZero'); c.mc.mark(0);
    await say('mc3');
    await c.go(60, 7000 / RATE, function (v) { c.mc.sector(0, v); });
    L('סיבוב שלם = 60 דקות = שעה אחת', true); await say('mc4');
    c.mc.sector(null); c.mc.mark(12); L('60 דקות: חוזרים ל-0'); await say('mcSixty'); c.mc.mark(0);
  });
}
function s2Two(i) {
  demo(i, 'two', tOf(4, 0), async function (cs, L) {
    L(''); await say('two1');
    L('4 בדיוק'); cs.hc.mark(4); await say('two2'); cs.hc.mark(0);
    var labs = ['4 ודקה', '4 ו-2 דקות', '4 ו-3 דקות'], keys = ['two3', 'two4', 'two5'];
    for (var j = 0; j < 3; j++) { await cs.go(tOf(4, j + 1), 900, function (v) { cs.mc.sector(0, v % 60); }); L(labs[j]); await say(keys[j]); }
    await cs.go(tOf(4, 27), 3000, function (v) { cs.mc.sector(0, v % 60); });
    L('4 ו-27 דקות'); await say(['n4', 'm27']);
    L('שעון השעות: 4 ומשהו. שעון הדקות: כמה דקות', true); await say('twoRule');
    // הערת אבירם 18.11: מה זה ה"משהו"? 27 הדקות שעברו. אז השעה: ארבע עשרים ושבע
    cs.mc.sector(0, 27); L('המשהו = 27 דקות. השעה: ארבע עשרים ושבע', true); await say('two6');
  });
}
function s2Count(i) { practice(i, { layout: 'min', count: 6, task: function (k) { return tCount(k < 2 ? rnd(1, 5) : k < 4 ? rnd(3, 9) : rnd(6, 14)); } }); }

  practice(i, { layout: 'min', count: 6,

      $s.innerHTML = lab('המספרים: כל 5 קווים'); await say('fv1'); await say('fv2');
      for (var f = 5; f <= 60; f += 5) { await cs.go(f, 500, function (v) { cs.mc.sector(0, v); }); cs.mc.mark(f / 5); $s.innerHTML = lab(f + (f === 60 ? ' = סיבוב שלם' : '')); await say('f' + f); }
      await wait(500);
    },

}
function s2Mix(i) {
  practice(i, { layout: 'min', count: 6,

      for (var f = 5; f <= 25; f += 5) { await cs.go(f, 450, function (v) { cs.mc.sector(0, v); }); cs.mc.mark(f / 5); $s.innerHTML = lab(f); await say('f' + f); }
      cs.mc.mark(0); await cs.go(26, 500, function (v) { cs.mc.sector2(25, v); }); $s.innerHTML = lab('25 ועוד 1'); await wait(500);
      await cs.go(27, 500, function (v) { cs.mc.sector2(25, v); }); $s.innerHTML = lab('25 ועוד 2 = 27 דקות', true); await say('mx2'); await wait(600);

    task: function () { var m; do { m = rnd(6, 58); } while (m % 5 === 0); return tMix(m); } });
}
/* הערת אבירם 18.11: בשני השעונים, קודם שתי דוגמאות איך עושים, ואז שואלים את הילד */
async function exRead2(cs, $s, H, m) {

function s2Read(i) {

/* ---------- שיעור 3: שני מחוגים בשעון אחד ---------- */
function s3Merge(i) {
  // הערות אבירם 18.11: דוגמה ראשונה שבה המחוגים לא באותו אזור (4 ו-35), ואז: איפה מחוג השעות, איפה מחוג הדקות (מסמנים את הדקות), וקוראים יחד
  demo(i, 'two', tOf(4, 35), async function (cs, L, rebuild) {
    L('שעון השעות + שעון הדקות'); await say('mg1');
    var a = document.getElementById('ckh'), b = document.getElementById('ckm');
    if (a && b && !SKIPPING) {
      var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), w = b.parentNode;
      w.classList.add('mergefly'); w.style.transform = 'translateX(' + (ra.left - rb.left) + 'px)'; w.style.opacity = '.55';
      await wait(1700);
    }
    var c2 = rebuild('one', tOf(4, 35)); c2.c.outer(true);
    L('שעון אחד, שני מחוגים', true);
    c2.c.glow('h', true); var p = say('mg2'); await wait(1900); c2.c.glow('h', false); c2.c.glow('m', true); await p; c2.c.glow('m', false);
    L('המספרים הכחולים מבחוץ = דקות'); await say('mg3');
    // איפה מחוג השעות?
    c2.c.glow('h', true); c2.c.mark(4); c2.c.sector2(20, 25); L('מחוג השעות: אחרי 4 = 4 ומשהו'); await say('mgH'); c2.c.glow('h', false); c2.c.mark(0); c2.c.sector2(null);
    // איפה מחוג הדקות? מצביעים, ומסמנים את הדקות בחמישיות
    c2.c.glow('m', true); c2.c.mark(7); L('מחוג הדקות: על המספר 7'); await say('mgM'); c2.c.mark(0);
    for (var f = 5; f <= 35; f += 5) { c2.c.sector(0, f); L(f + ' דקות'); await say('f' + f); }
    L('35 דקות', true); await say('c35'); c2.c.glow('m', false);
    L('4 ו-35 דקות', true); await say(['mgT', 'n4', 'm35']);
  });
}
function s3Round(i) {
  demo(i, 'one', tOf(4, 0), async function (cs, L) {
    cs.c.outer(true); L('4 בדיוק'); await say('rnd1');
    await cs.go(tOf(5, 0), 8000 / RATE, function (v) { var m = v - 240; cs.c.sector(0, m); cs.c.sector2(20, 20 + m / 12); });
    L('5 בדיוק: עברה שעה אחת', true); await say('rnd2');
  });
}
function s3Which(i) { practice(i, { layout: 'one', count: 6, task: function () { return tTap(Math.random() < .5 ? 'h' : 'm'); } }); }
function s3Nums(i) {
  practice(i, { layout: 'one', count: 6, t0: tOf(3, 15),
    intro: async function (cs, $s) {
      cs.c.outer(true); cs.c.mark(3); $s.innerHTML = lab('המספר 3: שעה 3, או 15 דקות'); await say('nm1'); cs.c.mark(0);
      cs.set(tOf(3, 0)); var p = say('nm2');
      for (var n = 1; n <= 3; n++) { await wait(n === 1 ? 2600 : 1500); await cs.go(tOf(3, n * 5), 500, function (v) { cs.c.sector(0, v % 60); }); cs.c.mark(n); $s.innerHTML = lab(n + ' = ' + n * 5 + ' דקות'); }
      await p; await wait(500);
    },
    task: function (k) { return tNums(rnd(1, 11), k < 3); } });
}
// הערת אבירם 18.11: לפני "מה השעה?" מתחילים מ-7 ודקה, 7 ו-2 דקות... עד 7 ו-6 דקות, ועוד כמה דוגמאות
function s3Read(i) { practice(i, { layout: 'one', count: 6, t0: tOf(7, 0),
  // הערת אבירם 18.11 (2): כל השעה, דקה אחרי דקה עד 7 ו-59, ואז 8 בדיוק. "הבנתי, ממשיכים" מדלג לשאלות
  intro: async function (cs, $s) {
    var stop = false, $c = document.getElementById('ctl');
    $c.innerHTML = '<button class="btn sec" id="introSkip">' + gx('הבנתי', 'הבנתי', 'הבנו') + ', ממשיכים ←</button>';
    document.getElementById('introSkip').onclick = function () { stop = true; skipNow(); };
    var sec = function (v) { cs.c.sector(0, v - tOf(7, 0)); };
    cs.c.outer(true); $s.innerHTML = lab('7 בדיוק'); await say('r3a');
    for (var j = 1; j <= 59 && !stop; j++) { await cs.go(tOf(7, j), j <= 6 ? 700 : 350, sec); $s.innerHTML = lab(fmtT(7, j), true); await say(['n7', 'm' + j]); }
    if (!stop) { await cs.go(tOf(8, 0), 700, sec); $s.innerHTML = lab('8 בדיוק: עברה שעה שלמה', true); await say('h8'); await wait(500); }
    SKIPPING = false; $c.innerHTML = ''; cs.c.sector(null); $s.innerHTML = ''; await say('yourTurn');
  },
  task: function (k) { return tRead(HB(), k < 4 ? rnd(1, 11) * 5 : rnd(1, 59), { one: true, outer: k < 2 }); } }); }
function s3Drag(i) { practice(i, { layout: 'one', count: 4, task: function (k) { return tDragBoth(HB(), k < 2 ? rnd(1, 11) * 5 : rnd(1, 59), false, k === 0); } }); }
function s3Check(i) {
  practice(i, { layout: 'one', streak: 3, intro: function () { return say('check1'); },
    task: function (k) { var kind = k % 3; if (kind === 0) return tRead(HB(), rnd(1, 11) * 5, { one: true }); if (kind === 1) return tNums(rnd(1, 11), false); return tDragBoth(HB(), rnd(1, 11) * 5, false); } });
}

function s4Read(i) { var ms = shuffle([0, 15, 30, 45, 15, 30, 45, 45]); practice(i, { layout: 'one', count: 8, task: function (k) { return tRead(HB(), ms[k % 8], { hq: true }); } }); }
function s4Drag(i) { var ms = [30, 15, 45, 30]; practice(i, { layout: 'one', count: 4, task: function (k) { return tDragBoth(HB(), ms[k % 4], true, k === 0); } }); }
function s4Check(i) {
  practice(i, { layout: 'one', streak: 3, intro: function () { return say('check1'); },
    task: function (k) { var m = [0, 15, 30, 45][rnd(0, 3)]; return k % 3 === 2 ? tDragBoth(HB(), m || 30, true) : tRead(HB(), m, { hq: true }); } });
}

FN = [[sWords, sFace, sExact, sMove, sSome, sDrag, sCheck],
  [s2Clock, s2Two, s2Count, s2Fives, s2Mix, s2Read, s2Drag, s2Check],
  [s3Merge, s3Round, s3Which, s3Nums, s3Read, s3Drag, s3Check],
  [s4Half, s4Quarter, s4Qto, s4Read, s4Drag, s4Check]];

/* פתיחה ישירה לשלב (מדף הבדיקה): #l=2&s=3 או הודעה { clockGo: [שיעור, שלב] } */
function boot() {
  var mm = /l=(\d)(?:&s=(\d+))?/.exec(location.hash || '');
  if (mm) { var l = +mm[1] - 1, s = mm[2] ? +mm[2] - 1 : -1; if (LESSONS[l]) { if (LESSONS[l].stages[s]) openStage(s, l); else map(l); return; } }
  // 18.11: מתוך התרגול של נושא בשעון (כפתור "לשיעור") -> נפתח ישר במפה של השיעור של הנושא
  if (CFG.l && LESSONS[CFG.l - 1]) { map(CFG.l - 1); return; }
  intro();
}
window.addEventListener('message', function (e) {
  var d = e.data || {}; if (!d.clockGo) return;
  var l = d.clockGo[0] - 1, s = d.clockGo[1] - 1; SKIPPING = false; if (!LESSONS[l]) return;
  if (LESSONS[l].stages[s]) openStage(s, l); else map(l);
});

window.addEventListener('pagehide', stopVoice);
document.addEventListener('visibilitychange', function () { if (document.hidden) stopVoice(); });
boot();
